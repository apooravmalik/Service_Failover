# Service Controller Configuration

# Cluster Configuration
cluster:
  name: "VERACITY-CLUSTER"
  role_name: "ViewScape-Master"
  default_primary_node: "VERACITY-APPV1"
  nodes:
    - name: "VERACITY-APPV1"
      ip: "172.16.10.56"
    - name: "VERACITY-APPV2" 
      ip: "172.16.10.57"

# ViewScape Service Configuration
viewscape:
  service_name: "ViewscapeMasterControl"
  ports: [500, 12345]
  connection_timeout: 5

# Services to Monitor
services:
  - name: "Veracity_PTZ"
    log_enabled: true
    log_path: "C:/Work/Veracity/veracity_milestone_service/utils/proserver_PTZ-2025-05-13-11-39-52.sil"
    sil_file: true
    checks:
      - find_string: "Log started"
        action: "find_last"
      - find_string: "CreateNewPTZIntance" 
        action: "find_after_previous"
        search_lines: 25
    database_updates:
      - table: "MySettings_TBL"
        set_column: "mysValue_TXT"
        set_value_template: "{machine_ip}"
        where_condition: "mysName_TXT LIKE '%MilestonePTZServerTarget%'"
  
  #Example service configuration
  - name: "Veracity_Recording"
    log_enabled: true
    log_path: "C:\\Logs\\Recording\\recording_service.sil"
    sil_file: true
    checks:
      - find_string: "Recording Service Started"
        action: "find_last"
      - find_string: "All channels initialized"
        action: "find_after_previous"
        search_lines: 30
    database_updates:
      - table: "MySettings_TBL"
        set_column: "mysValue_TXT"
        set_value_template: "{machine_ip}"
        where_condition: "mysName_TXT LIKE '%RecordingServerTarget%'"

# General Settings
settings:
  check_interval: 30  # seconds
  service_restart_timeout: 60  # seconds
  log_encoding: "utf-8"
  max_log_lines_to_check: 1000
  
# Logging Configuration  
logging:
  level: "INFO"
  file_path: "service_controller.log"
  max_file_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

# Database Schema
database:
  schema: "dbo"
  connection_pool:
    size: 5
    max_overflow: 10
    timeout: 30
    recycle: 3600